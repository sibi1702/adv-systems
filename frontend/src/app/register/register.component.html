<div class="container">

    <div class="card o-hidden border-0 shadow-lg my-5">
        <div class="card-body p-0">
            <!-- Nested Row within Card Body -->
            <div class="row">
                <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
                <div class="col-lg-7">
                    <div class="p-5">
                        <div class="text-center">
                            <h1 class="h4 text-gray-900 mb-4">Create an Account!</h1>
                        </div>
                        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="user">
                            <div class="form-group row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <input type="text"
                                        required
                                        class="form-control form-control-user"
                                        formControlName="firstname"
                                        id="firstname"
                                        placeholder="First Name" />
                                    <div *ngIf="submitted &&  f.firstname.errors?.required" class="text-danger validation-error">* Please enter first name.</div>
                                </div>
                                <div class="col-sm-6">
                                    <input
                                        required
                                        type="text"
                                        class="form-control form-control-user"
                                        formControlName="lastname"
                                        id="lastname"
                                        placeholder="Last Name" />
                                    <div *ngIf="submitted &&  f.lastname.errors?.required" class="text-danger validation-error">* Please enter last name.</div>
                                </div>
                            </div>
                            <div class="form-group">
                                <input
                                    required
                                    type="email"
                                    class="form-control form-control-user"
                                    id="email"
                                    formControlName="email"
                                    placeholder="Email Address" />
                                <div *ngIf="submitted && f.email.errors?.required" class="text-danger validation-error">* Please enter valid email id.</div>
                            </div>
                            <div class="form-group row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <input
                                        type="password"
                                        class="form-control form-control-user"
                                        id="password"
                                        formControlName="password"
                                        placeholder="Password">
                                    <div *ngIf="submitted && f.password.errors?.required" class="text-danger validation-error">* Please enter password.</div>
                                </div>
                                <div class="col-sm-6">
                                    <input
                                        type="password"
                                        class="form-control form-control-user"
                                        id="confirmPassword"
                                        formControlName="confirmPassword"
                                        placeholder="Repeat Password">
                                    <div *ngIf="submitted &&  f.confirmPassword.errors?.required" class="text-danger validation-error">* Please enter password.</div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-user btn-block">
                                Register Account
                            </button>
                            <hr>
                            <a (click)="signInWithGoogle()" class="btn btn-google btn-user btn-block">
                                <i class="fab fa-google fa-fw"></i> Register with Google
                            </a>
                            <a (click)="signInWithFB()" class="btn btn-facebook btn-user btn-block">
                                <i class="fab fa-facebook-f fa-fw"></i> Register with Facebook
                            </a>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a class="small" href="forgot-password.html">Forgot Password?</a>
                        </div>
                        <div class="text-center">
                            <a class="small" href="login.html">Already have an account? Login!</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
